<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebZoneClock</title>
<meta name="description" content="A world clock: see the time in cities around the globe on a live day/night map.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/themes.css">
</head>
<body>
<div class="app">

  <header class="toolbar">
    <div class="toolbar-left">
      <button id="add-city" class="icon-btn" type="button" title="Add a city" aria-label="Add a city">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4.5v11M4.5 10h11"/></svg>
      </button>
    </div>
    <div class="toolbar-right">
      <button id="toggle-daylight" class="icon-btn" type="button" title="Toggle daylight shading"
              aria-label="Toggle daylight shading" aria-pressed="true">
        <svg viewBox="0 0 20 20" aria-hidden="true" class="sun-icon">
          <circle cx="10" cy="10" r="3.4"/>
          <g class="rays">
            <path d="M10 1.6v2.2M10 16.2v2.2M1.6 10h2.2M16.2 10h2.2"/>
            <path d="M4.05 4.05l1.56 1.56M14.39 14.39l1.56 1.56M15.95 4.05l-1.56 1.56M5.61 14.39l-1.56 1.56"/>
          </g>
        </svg>
      </button>
      <div class="picker">
        <button id="hours-btn" class="icon-btn" type="button" aria-haspopup="true"
                aria-expanded="false" title="Working hours and order"
                aria-label="Working hours and order">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="10" cy="10" r="7"/><path d="M10 5.6V10l3 1.8"/>
          </svg>
        </button>
        <div id="hours-menu" class="picker-menu settings-menu" role="dialog"
             aria-label="Working hours and order" hidden>
          <p class="settings-note">Colours every city by what its people are likely doing.</p>
          <label class="settings-row">
            <span>Up from</span>
            <select id="hours-day-start" aria-label="Hour people are up from"></select>
          </label>
          <label class="settings-row">
            <span>Working</span>
            <select id="hours-work-start" aria-label="Hour work starts"></select>
          </label>
          <label class="settings-row">
            <span>until</span>
            <select id="hours-work-end" aria-label="Hour work ends"></select>
          </label>
          <label class="settings-row settings-check">
            <input type="checkbox" id="hours-weekends">
            <span>Nobody works at the weekend</span>
          </label>
          <hr class="settings-rule">
          <label class="settings-row">
            <span>Order</span>
            <select id="sort-mode" aria-label="How to order the cities">
              <option value="manual">However I arranged them</option>
              <option value="offset">West to east</option>
            </select>
          </label>
        </div>
      </div>
      <div class="picker">
        <button id="theme-btn" class="text-btn" type="button" aria-haspopup="true"
                aria-expanded="false" title="Change the look">
          <span class="swatch" id="theme-swatch" aria-hidden="true"></span>
          <span id="theme-name">Daylight</span>
        </button>
        <div id="theme-menu" class="picker-menu" role="menu" aria-label="Look" hidden></div>
      </div>
      <div class="segmented" role="group" aria-label="Time format">
        <button type="button" data-hour12="1" aria-pressed="false">12</button>
        <button type="button" data-hour12="0" aria-pressed="true">24</button>
      </div>
      <a class="text-btn" href="https://github.com/" id="repo-link" target="_blank" rel="noopener"
         title="Source on GitHub">
        <svg viewBox="0 0 16 16" aria-hidden="true" class="gh-icon"><path d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38l-.01-1.49c-2.23.48-2.7-1.07-2.7-1.07-.36-.93-.89-1.18-.89-1.18-.73-.5.05-.49.05-.49.8.06 1.23.83 1.23.83.71 1.22 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.03 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48l-.01 2.2c0 .21.14.46.55.38A8 8 0 0 0 8 0z"/></svg>
        <span>Source</span>
      </a>
    </div>
  </header>

  <div class="strip-wrap">
    <div id="strip" class="strip" role="list"
         aria-label="Your cities. Arrow keys move between them, Enter sets your home city, Alt with an arrow reorders, Delete removes."></div>
    <p id="strip-empty" class="strip-empty" hidden>
      No cities yet — press <kbd>+</kbd> to add one.
    </p>
  </div>

  <main class="map-wrap">
    <canvas id="map" class="map-canvas"></canvas>
    <div id="pins" class="pin-layer" aria-hidden="true"></div>
    <button id="reveal" class="share-btn" type="button" title="Plan a time"
            aria-label="Plan a time" aria-expanded="false">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path d="M10 13.5V3.2M6.2 6.8L10 3l3.8 3.8"/>
        <path d="M4.5 12.4v3.1a1.4 1.4 0 0 0 1.4 1.4h8.2a1.4 1.4 0 0 0 1.4-1.4v-3.1"/>
      </svg>
    </button>

    <div id="timebar" class="timebar" data-travelling="false">
      <div class="timebar-actions">
        <button id="add-calendar" class="tb-btn" type="button" disabled
                title="Download a calendar invitation for the selected time">
          Add to calendar
        </button>
        <button id="share" class="tb-btn primary" type="button"
                title="Copy a link to this set of cities">
          <svg viewBox="0 0 20 20" aria-hidden="true" class="tb-icon">
            <path d="M10 13.5V3.2M6.2 6.8L10 3l3.8 3.8"/>
            <path d="M4.5 12.4v3.1a1.4 1.4 0 0 0 1.4 1.4h8.2a1.4 1.4 0 0 0 1.4-1.4v-3.1"/>
          </svg>
          Share
        </button>
      </div>

      <div id="ruler" class="ruler" role="slider" tabindex="0"
           aria-label="Shift every clock by an offset from now"
           aria-valuemin="-1440" aria-valuemax="1440" aria-valuenow="0" aria-valuetext="Now">
        <div id="ruler-ticks" class="ruler-ticks"></div>
        <div id="ruler-line" class="ruler-line" data-dir="none"></div>
        <div id="ruler-handle" class="ruler-handle" data-dir="none">
          <span id="handle-label">Now</span>
          <button class="handle-clear" id="handle-clear" type="button" aria-label="Back to now">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 6l8 8M14 6l-8 8"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>

</div>

<div id="search-overlay" class="overlay" hidden>
  <div class="search-panel" role="dialog" aria-modal="true" aria-label="Add a city">
    <div class="search-input-row">
      <svg viewBox="0 0 20 20" class="search-icon" aria-hidden="true">
        <circle cx="8.6" cy="8.6" r="5.4"/><path d="M12.6 12.6l4 4"/>
      </svg>
      <input id="search-input" type="search" placeholder="Search for a city or country"
             autocomplete="off" spellcheck="false" aria-label="Search for a city or country">
      <button id="search-close" class="icon-btn small" type="button" aria-label="Close">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg>
      </button>
    </div>
    <ul id="search-results" class="search-results" role="listbox" aria-label="Matching cities"></ul>
    <p id="search-hint" class="search-hint">Type to search 2,300 cities.</p>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="live" class="visually-hidden" role="status" aria-live="polite"></div>

<script type="module" src="assets/js/main.js"></script>
<script>
  // Offline support is an enhancement: if it fails, the app still works.
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
